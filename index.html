<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graphic Designer Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0b;--fg:#f2efe9;--o:#ff4a1c;--mut:#9a948a;--card:#171717;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Rajdhani,system-ui,sans-serif;font-size:18px}
h1,h2,h3,.t{font-family:Teko,Impact,sans-serif;text-transform:uppercase;margin:0;letter-spacing:.03em}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:20;display:flex;gap:22px;justify-content:center;padding:14px;background:linear-gradient(#000c,#0000)}
nav a{color:var(--fg);text-decoration:none;font-family:Teko,Impact,sans-serif;font-size:20px;letter-spacing:.08em;text-transform:uppercase}nav a:hover{color:var(--o)}
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(160deg,#ff7a1c,#b3200a 55%,#2a0a05) center/cover;overflow:hidden}
.hero .ov{position:absolute;inset:0;background:linear-gradient(#0000 40%,var(--bg))}
#fx{position:absolute;inset:0;width:100%;height:100%}
.hero .in{position:relative;padding:20px}
.hero h1{font-size:clamp(46px,9vw,110px);line-height:.95;font-style:italic;background:#000a;display:inline-block;padding:6px 26px;transform:rotate(-1.5deg);clip-path:polygon(0 8%,4% 0,30% 6%,60% 0,96% 5%,100% 30%,98% 70%,100% 95%,70% 100%,35% 94%,5% 100%,0 70%)}
.hero p{max-width:560px;margin:18px auto;color:#fff;font-size:20px}
.btn{display:inline-block;border:2px solid var(--o);color:var(--fg);background:none;padding:8px 22px;font:600 18px Teko,Impact,sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn:hover,.btn.f{background:var(--o);color:#000}
section{padding:80px 6vw;max-width:1200px;margin:auto}
.lbl{color:var(--o);font:600 14px Rajdhani,sans-serif;letter-spacing:.2em;text-transform:uppercase}
h2{font-size:clamp(40px,6vw,72px);color:var(--o);font-style:italic;transform:rotate(-2deg);margin:4px 0 24px;display:inline-block;border-bottom:5px solid var(--o)}
.about{display:grid;grid-template-columns:minmax(0,280px) 1fr;gap:40px;align-items:center}
.about img,.ph{width:100%;aspect-ratio:1;object-fit:cover;background:var(--card);clip-path:polygon(0 3%,8% 0,50% 3%,92% 0,100% 5%,97% 50%,100% 94%,60% 100%,10% 97%,0 90%,3% 45%)}
.ph{display:grid;place-items:center;color:var(--mut)}
@media(max-width:700px){.about{grid-template-columns:1fr}}
.wk{background:#fff;color:#111;max-width:none;clip-path:polygon(0 2%,6% 0,20% 1.5%,45% 0,70% 1.5%,100% 0,100% 98%,80% 100%,55% 98.5%,30% 100%,0 98%)}
.wk>div{max-width:1200px;margin:auto;padding:60px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:22px}
.card{position:relative;background:#111;color:var(--fg);cursor:pointer;overflow:hidden}
.card .m{aspect-ratio:4/3;background:#222 center/cover;display:grid;place-items:center;font-size:46px;color:var(--o);transition:transform .4s}
.card:hover .m{transform:scale(1.07)}
.card .b{padding:12px 14px;position:relative;background:#111}
.card h3{font-size:26px;color:var(--o)}.card p{margin:2px 0 0;font-size:16px;color:#cfc9bf}
.x{position:absolute;top:8px;right:8px;background:#000c;color:#fff;border:1px solid var(--o);padding:2px 10px;cursor:pointer;font:600 14px Rajdhani,sans-serif;z-index:3}
.sk{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:18px 50px}
.sk .r{display:flex;justify-content:space-between;font-family:Teko,Impact,sans-serif;font-size:22px;letter-spacing:.05em;text-transform:uppercase}
.lg{width:28px;height:28px;object-fit:contain;vertical-align:middle;margin-right:8px}
.bar{height:8px;background:#2a2a2a;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#ff7a1c,var(--o));transition:width 1.4s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px var(--o)}
.ex{border-left:3px solid var(--o);padding:0 0 22px 22px;position:relative}.ex:before{content:"";position:absolute;left:-8px;top:6px;width:13px;height:13px;background:var(--o);transform:rotate(45deg)}
.ex h3{font-size:28px}.ex .d{color:var(--o);font-weight:600}.ex p{margin:4px 0;color:#cfc9bf}
footer{padding:50px 6vw 90px;text-align:center;border-top:1px solid #222;color:var(--mut)}
#bar{position:fixed;bottom:env(safe-area-inset-bottom,0px);left:0;right:0;z-index:30;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px;background:#000e;border-top:2px solid var(--o)}
#bar .btn{padding:4px 14px;font-size:17px}
#adm{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:31;opacity:.8}
body:not(.ed) .x,body:not(.ed) #bar{display:none}body.ed #adm{display:none}
.md{position:fixed;inset:0;z-index:50;background:#000d;display:grid;place-items:center;padding:14px;overflow:auto}
.md .bx{background:#141414;border:2px solid var(--o);padding:22px;width:min(560px,100%);max-height:92vh;overflow:auto}
.md label{display:block;margin:10px 0 3px;color:var(--o);font-size:15px;letter-spacing:.1em;text-transform:uppercase}
.md input,.md textarea,.md select{width:100%;background:#0b0b0b;border:1px solid #444;color:var(--fg);padding:8px;font:inherit}
.md video,.md img{max-width:100%;max-height:70vh;display:block;margin:auto}
.alb{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;border:2px solid var(--o);clip-path:polygon(0 1%,3% 0,40% 1.5%,100% 0,100% 99%,60% 100%,25% 98.5%,0 100%)}
.sl{position:absolute;inset:0;opacity:0;transition:opacity .8s;pointer-events:none}.sl.on{opacity:1;pointer-events:auto}
.sl img,.sl video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.cap{position:absolute;left:0;right:0;bottom:0;padding:44px 18px 16px;background:linear-gradient(#0000,#000d);display:flex;flex-direction:column;pointer-events:none}
.cap b{font:700 30px Teko,Impact,sans-serif;color:var(--o);text-transform:uppercase}
.nv{position:absolute;top:50%;transform:translateY(-50%);background:#000a;color:#fff;border:1px solid var(--o);width:42px;height:56px;font-size:28px;cursor:pointer;z-index:3}.nv.l{left:8px}.nv.r{right:8px}
.dots{position:absolute;bottom:10px;right:16px;display:flex;gap:9px;z-index:3}.dots i{width:10px;height:10px;background:#fff6;cursor:pointer;transform:rotate(45deg)}.dots i.on{background:var(--o)}
.pg{position:absolute;top:0;left:0;right:0;height:3px;z-index:3}.pg b{display:block;height:100%;background:var(--o);transform-origin:left}
@keyframes pg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
body{overflow-x:clip}
@media(max-width:700px){
.card{grid-column:auto!important}
nav{justify-content:flex-start;gap:16px;overflow-x:auto;white-space:nowrap;padding:12px 14px;background:#000d;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{font-size:18px}
section{padding:56px 5vw}
.wk>div{padding:40px 0}
.hero h1{padding:4px 16px}
.hero p{font-size:18px}
.about>div:first-child{max-width:220px;margin:auto}
.alb{aspect-ratio:4/3}
.cap{padding:30px 12px 12px}.cap b{font-size:22px}.cap span{font-size:14px}
.nv{width:34px;height:44px}
.dots{bottom:8px;right:10px;gap:7px}
#bar{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;gap:6px;scrollbar-width:none}
#bar .btn{white-space:nowrap;flex:none;padding:8px 14px}
.btn{padding:10px 20px}
.md{padding:8px;align-items:start}
.md .bx{padding:16px}
.md input,.md textarea,.md select{font-size:16px}
.x{padding:6px 12px;font-size:15px}
h2{margin-bottom:16px}
footer{padding-bottom:96px}
}
#cv{display:none}
@media print{
@page{margin:0}
body>*:not(#cv){display:none!important}
#cv{display:block;color:#111;background:#fff;font-size:14px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#cv .hd{background:#0b0b0b;color:#fff;padding:28px 34px;display:flex;gap:24px;align-items:center;border-bottom:6px solid var(--o)}
#cv .hd img,#cv .hd .ph{width:120px;height:120px;flex:none}
#cv h1{font-size:46px;color:var(--o);font-style:italic;font-family:Teko,Impact,sans-serif;text-transform:uppercase;margin:0}#cv .hd p{margin:2px 0;color:#ddd}
#cv .bd{display:grid;grid-template-columns:1fr 2fr;gap:26px;padding:26px 34px}
#cv h3{color:var(--o);font-size:24px;border-bottom:2px solid #111;margin:0 0 8px}
#cv .bar{background:#ddd}#cv .bar i{width:var(--w)!important;transition:none}
#cv .sr{margin-bottom:10px;font-weight:600}#cv .e{margin-bottom:12px}
}
</style></head><body>
<nav><a href="#home">Home</a><a href="#album">Album</a><a href="#works">Works</a><a href="#ai">AI Videos</a><a href="#skills">Skills</a><a href="#exp">Experience</a><a href="#edu">Education</a></nav>
<main id="app"></main>
<div id="cv"></div>
<button class="btn f" id="adm" data-a="login">Admin</button>
<div id="bar">
<button class="btn" data-a="prof">Edit Profile</button><button class="btn" data-a="cover">Cover</button><button class="btn" data-a="addw">+ Work</button><button class="btn" data-a="addai">+ AI Video</button><button class="btn" data-a="adds">+ Skill</button><button class="btn" data-a="adde">+ Experience</button><button class="btn" data-a="adedu">+ Education</button><button class="btn f" data-a="cv">Export CV PDF</button><button class="btn" data-a="done">Done</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={p:{name:'Your Name',role:'Graphic Designer · VFX Artist',tag:'Crafting bold visuals for games and film',bio:'Write about yourself here. Click Admin, then Edit Profile.',email:'you@email.com',phone:'',loc:'Sri Lanka'},cover:null,avatar:null,works:[],ai:[],edu:[{deg:'Degree / Diploma',sch:'School or Institute',yr:'2018 - 2021',d:''}],skills:[{n:'Photoshop',v:90},{n:'Illustrator',v:85},{n:'After Effects',v:75},{n:'Blender',v:60}],exp:[{role:'Graphic Designer',co:'Company name',yr:'2022 - Present',d:'What you did there.'}]};
const U=b=>typeof b==='string'?b:b?URL.createObjectURL(b):'';
function render(){
const p=S.p,av=U(S.avatar),cv=U(S.cover);
document.getElementById('app').innerHTML=`
<header class="hero" id="home" style="${cv?`background-image:url(${cv})`:''}"><canvas id="fx"></canvas><div class="ov"></div><div class="in"><div class="lbl">${E(p.role)}</div><h1>${E(p.name)}</h1><p>${E(p.tag)}</p><a class="btn f" href="#works">View Works</a> <a class="btn" href="#exp">Experience</a></div></header>
${albumHTML()}<section class="about"><div>${av?`<img src="${av}" alt="">`:'<div class="ph">Photo</div>'}</div><div><div class="lbl">About me</div><h2>Profile</h2><p>${E(p.bio).replace(/\n/g,'<br>')}</p><p class="lbl">${E(p.email)} ${p.phone?'· '+E(p.phone):''} · ${E(p.loc)}</p></div></section>
<section class="wk" id="works"><div><div class="lbl" style="color:#c2300a">Selected</div><h2>Works</h2><div class="grid">${S.works.length?S.works.map((w,i)=>`<div class="card" data-a="open" data-i="${i}" style="grid-column:span ${w.sz||1}"><button class="x" data-a="delw" data-i="${i}">Delete</button><button class="x" style="right:78px" data-a="edw" data-i="${i}">Edit</button><div class="m" style="${w.img?`background-image:url(${U(w.img)});background-size:${w.ft||'cover'};background-repeat:no-repeat`:''};aspect-ratio:${w.sz==3?'21/9':w.sz==2?'16/9':'4/3'}">${w.img?'':(w.vid?'▶':'')}</div><div class="b"><h3>${E(w.t)} ${w.vid?'▶':''}</h3><p>${E(w.d)}</p></div></div>`).join(''):'<p>No works yet. Admin → + Work.</p>'}</div></div></section>
<section id="ai"><div class="lbl">Generated</div><h2>AI Videos</h2><div class="grid">${S.ai.length?S.ai.map((v,i)=>`<div class="card" style="cursor:default;grid-column:span ${v.sz||1}"><button class="x" data-a="delai" data-i="${i}">Delete</button><button class="x" style="right:78px" data-a="edai" data-i="${i}">Edit</button><video src="${U(v.vid)}" controls preload="metadata" playsinline style="width:100%;aspect-ratio:${v.sz==3?'21/9':'16/9'};background:#000;object-fit:${v.ft||'contain'};display:block"></video><div class="b"><h3>${E(v.t)}</h3><p>${E(v.d)}</p></div></div>`).join(''):'<p>No AI videos yet. Admin → + AI Video.</p>'}</div></section>
<section id="skills"><div class="lbl">Abilities</div><h2>Skills</h2><div class="sk">${S.skills.map((s,i)=>`<div><div class="r"><span>${s.logo?`<img class="lg" src="${U(s.logo)}" alt="">`:''}${E(s.n)}</span><span>${s.v}%</span></div><div class="bar"><i data-w="${s.v}"></i></div><button class="x" style="position:static;margin-top:4px" data-a="dels" data-i="${i}">Delete</button></div>`).join('')}</div></section>
<section id="exp"><div class="lbl">Career</div><h2>Experience</h2>${S.exp.map((e,i)=>`<div class="ex"><h3>${E(e.role)} · ${E(e.co)}</h3><div class="d">${E(e.yr)}</div>${LN(e.d)}<button class="x" style="position:static" data-a="dele" data-i="${i}">Delete</button></div>`).join('')}</section>
<section id="edu"><div class="lbl">Learning</div><h2>Education</h2>${S.edu.map((e,i)=>`<div class="ex"><h3>${E(e.deg)} · ${E(e.sch)}</h3><div class="d">${E(e.yr)}</div>${LN(e.d)}<button class="x" style="position:static" data-a="deledu" data-i="${i}">Delete</button></div>`).join('')}</section>
<footer><h3 class="t" style="color:var(--o);font-size:32px">${E(p.name)}</h3>${E(p.email)} · ${E(p.loc)}</footer>`;
document.getElementById('cv').innerHTML=`<div class="hd">${av?`<img src="${av}" alt="">`:'<div class="ph"></div>'}<div><h1>${E(p.name)}</h1><p class="t" style="font-size:24px">${E(p.role)}</p><p>${E(p.email)} ${p.phone?'· '+E(p.phone):''} · ${E(p.loc)}</p></div></div><div class="bd"><div><h3>Skills</h3>${S.skills.map(s=>`<div class="sr">${E(s.n)}<div class="bar"><i style="--w:${s.v}%"></i></div></div>`).join('')}</div><div><h3>Profile</h3><p>${E(p.bio)}</p><h3>Experience</h3>${S.exp.map(e=>`<div class="e"><b>${E(e.role)}</b> · ${E(e.co)}<br><span style="color:var(--o)">${E(e.yr)}</span><br>${E(e.d)}</div>`).join('')}</div></div>`;
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.style.width=x.target.dataset.w+'%';io.unobserve(x.target)}}),{threshold:.3});
document.querySelectorAll('.bar i[data-w]').forEach(i=>io.observe(i));fx();albInit()}
function fx(){const c=document.getElementById('fx'),x=c.getContext('2d');let W=c.width=c.offsetWidth,H=c.height=c.offsetHeight;
const P=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.5+.5,v:Math.random()*1.2+.3,s:Math.random()*2-1}));
(function f(){if(!c.isConnected)return;x.clearRect(0,0,W,H);P.forEach(p=>{p.y-=p.v;p.x+=p.s*.4;if(p.y<0){p.y=H;p.x=Math.random()*W}x.fillStyle='rgba(255,170,60,.8)';x.shadowColor='#ff4a1c';x.shadowBlur=8;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});requestAnimationFrame(f)})()}
function img(file,max=1600){return new Promise(r=>{if(!file)return r(null);const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>r(b),'image/jpeg',.85)};i.onerror=()=>r(null);i.src=URL.createObjectURL(file)})}
function form(title,fs,ok){const m=document.createElement('div');m.className='md';m.innerHTML=`<div class="bx"><h3 class="t" style="color:var(--o);font-size:30px">${title}</h3>${fs.map(f=>`<label>${f.l}</label>${f.t==='sel'?`<select name="${f.k}">${f.o.map(x=>`<option value="${x[0]}"${x[0]==f.v?' selected':''}>${x[1]}</option>`).join('')}</select>`:f.t==='area'?`<textarea name="${f.k}" rows="5">${E(f.v)}</textarea>`:`<input name="${f.k}" type="${f.t||'text'}" ${f.a?`accept="${f.a}"`:''} value="${f.t==='file'?'':E(f.v)}">`}`).join('')}<p style="margin-top:16px"><button class="btn f" id="ok">Save</button> <button class="btn" id="no">Cancel</button></p></div>`;
document.body.appendChild(m);m.querySelector('#no').onclick=()=>m.remove();
m.querySelector('#ok').onclick=async()=>{const o={};m.querySelectorAll('[name]').forEach(e=>o[e.name]=e.type==='file'?e.files[0]:e.value);m.querySelector('#ok').textContent='...';await ok(o);await save();m.remove();render()}}
const FS=(o={})=>[{k:'t',l:'Title',v:o.t||''},{k:'d',l:'Description',v:o.d||''},{k:'sz',l:'Card size',t:'sel',v:o.sz||'1',o:[['1','Normal'],['2','Wide (2 columns)'],['3','Full width']]},{k:'ft',l:'Fit (whole image / fill)',t:'sel',v:o.ft||'cover',o:[['cover','Fill the card (crop)'],['contain','Fit whole image']]}];
function albumHTML(){const L=[...S.works.filter(w=>w.img).map(w=>({t:w.t,d:w.d,img:w.img})),...S.ai.map(v=>({t:v.t,d:v.d,vid:v.vid}))];if(!L.length)return'';return `<section id="album"><div class="lbl">Live</div><h2>Album</h2><div class="alb" id="alb">${L.map((x,i)=>`<div class="sl${i?'':' on'}">${x.vid?`<video src="${U(x.vid)}" muted loop playsinline preload="metadata"></video>`:`<img src="${U(x.img)}" alt="">`}<div class="cap"><b>${E(x.t)}</b><span>${E(x.d)}</span></div></div>`).join('')}<button class="nv l" data-a="alp">‹</button><button class="nv r" data-a="aln">›</button><div class="dots">${L.map((x,i)=>`<i data-a="ald" data-i="${i}"></i>`).join('')}</div><div class="pg"><b></b></div></div></section>`}
let AX=0,AT=null;
function alb(n){const el=document.getElementById('alb');if(!el)return;const s=el.querySelectorAll('.sl'),k=(n+s.length)%s.length;AX=k;s.forEach((e,i)=>{e.classList.toggle('on',i===k);const v=e.querySelector('video');if(v){if(i===k){v.currentTime=0;v.play().catch(()=>{})}else v.pause()}});el.querySelectorAll('.dots i').forEach((e,i)=>e.classList.toggle('on',i===k));const b=el.querySelector('.pg b');b.style.animation='none';void b.offsetWidth;b.style.animation='pg 6s linear forwards'}
function albInit(){clearInterval(AT);const el=document.getElementById('alb');if(!el)return;alb(0);let sx=0;el.ontouchstart=e=>{sx=e.touches[0].clientX};el.ontouchend=e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)alb(AX+(dx<0?1:-1))};AT=setInterval(()=>{if(!el.isConnected){clearInterval(AT);return}if(!(matchMedia('(hover:hover)').matches&&el.matches(':hover')))alb(AX+1)},6000)}
function ask(msg,fn){const m=document.createElement('div');m.className='md';m.innerHTML=`<div class="bx" style="width:min(380px,100%)"><h3 class="t" style="color:var(--o);font-size:28px">${E(msg)}</h3><p style="margin-top:16px"><button class="btn f" id="y">Delete</button> <button class="btn" id="n">Cancel</button></p></div>`;document.body.appendChild(m);m.querySelector('#n').onclick=()=>m.remove();m.querySelector('#y').onclick=()=>{m.remove();fn()}}
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000;color:#fff;border:2px solid #ff4a1c;padding:10px 18px;z-index:99;max-width:90vw';document.body.appendChild(t);setTimeout(()=>t.remove(),4000)}
window.alert=toast;
async function api(path,opt){const r=await fetch(path,opt);if(!r.ok)throw new Error((await r.text().catch(()=>''))||r.status);return r}
async function up(b){const r=await api('/api/upload',{method:'POST',headers:{'Content-Type':b.type||'application/octet-stream'},body:b});return (await r.json()).url}
async function upBlobs(){const u=async b=>b instanceof Blob?await up(b):b;S.avatar=await u(S.avatar);S.cover=await u(S.cover);for(const w of S.works){w.img=await u(w.img);w.vid=await u(w.vid)}for(const v of S.ai)v.vid=await u(v.vid);for(const s of S.skills)s.logo=await u(s.logo)}

function sq(b,n){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(i.width,i.height),c=document.createElement('canvas');c.width=c.height=n;c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,n,n);r(c.toDataURL('image/jpeg',.9))};i.onerror=()=>r(null);i.src=URL.createObjectURL(b)})}
const b64=b=>new Promise(r=>{if(typeof b==='string'){const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.naturalWidth;c.height=i.naturalHeight;c.getContext('2d').drawImage(i,0,0);try{r(c.toDataURL('image/png'))}catch(e){r(null)}};i.onerror=()=>r(null);i.src=b;return}const f=new FileReader();f.onload=()=>r(f.result);f.onerror=()=>r(null);f.readAsDataURL(b)});
function crop(b,w,h){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.max(w/i.width,h/i.height),c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#111';g.fillRect(0,0,w,h);g.drawImage(i,(w-i.width*k)/2,(h-i.height*k)/2,i.width*k,i.height*k);r(c.toDataURL('image/jpeg',.88))};i.onerror=()=>r(null);i.src=typeof b==='string'?b:URL.createObjectURL(b)})}
async function pdf(btn){

try{
const d=new jspdf.jsPDF({unit:'mm',format:'a4'}),W=210,M=16,p=S.p,O=[255,74,28];
d.setFillColor(11,11,11);d.rect(0,0,W,52,'F');d.setFillColor(...O);d.rect(0,52,W,2.5,'F');
let tx=M;
if(S.avatar){const u=await crop(S.avatar,500,500);if(u){d.addImage(u,'JPEG',M,10,32,32);tx=M+40}}

d.setTextColor(...O);d.setFont('helvetica','bolditalic');d.setFontSize(nm.length>20?22:30);d.text(nm,tx,24,{maxWidth:W-tx-M});
d.setTextColor(255,255,255);d.setFont('helvetica','bold');d.setFontSize(12);d.text((p.role||'').toUpperCase(),tx,32,{maxWidth:W-tx-M});
d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(200,200,200);d.text([p.email,p.phone,p.loc].filter(Boolean).join('   |   '),tx,39,{maxWidth:W-tx-M});

const RX=M+68,RW=W-M-RX;let ry=68;

const bul=t=>{d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(40,40,40);(t||'').split('\n').filter(Boolean).forEach(l=>d.splitTextToSize('\u2022 '+l,RW).forEach((s,j)=>{chk(5);d.text(s,RX+(j?3:0),ry);ry+=5}))};
const item=(a,b,yr,t)=>{chk(18);d.setFont('helvetica','bold');d.setFontSize(11);d.setTextColor(17,17,17);d.text(a+(b?' - '+b:''),RX,ry,{maxWidth:RW});ry+=5;d.setFontSize(9.5);d.setTextColor(...O);d.text(yr||'',RX,ry);ry+=5;bul(t);ry+=4};
H('Profile',RX,ry,RW);ry+=10;
d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(40,40,40);
d.splitTextToSize(p.bio||'',RW).forEach(l=>{chk(5);d.text(l,RX,ry);ry+=5});
ry+=8;chk(24);H('Experience',RX,ry,RW);ry+=10;
S.exp.forEach(e=>item(e.role||'',e.co,e.yr,e.d));
if(S.edu.length){ry+=4;chk(24);H('Education',RX,ry,RW);ry+=10;S.edu.forEach(e=>item(e.deg||'',e.sch,e.yr,e.d))}
d.setPage(1);
const LW=56;let y=68;
H('Skills',M,y,LW);y+=12;
for(const s of S.skills){
const u=s.logo?await b64(s.logo):null;
if(u)d.addImage(u,'PNG',M,y-5.5,7,7);
d.setFont('helvetica','bold');d.setFontSize(10);d.setTextColor(17,17,17);d.text(s.n,M+(u?9:0),y,{maxWidth:LW-22});d.text(s.v+'%',M+LW,y,{align:'right'});

const ws=S.works.filter(w=>w.img);
if(ws.length){
d.addPage();d.setFillColor(11,11,11);d.rect(0,0,W,24,'F');d.setFillColor(...O);d.rect(0,24,W,2,'F');
d.setTextColor(...O);d.setFont('helvetica','bolditalic');d.setFontSize(22);d.text('SELECTED WORKS',M,16);
const gap=6,cw=(W-2*M-2*gap)/3,ch=cw*.75;let wy=36,col=0;
for(const w of ws){

const x=M+col*(cw+gap),u=await crop(w.img,720,540);
if(u)d.addImage(u,'JPEG',x,wy,cw,ch);
d.setDrawColor(...O);d.setLineWidth(.8);d.line(x,wy+ch+1.2,x+cw,wy+ch+1.2);
d.setFont('helvetica','bold');d.setFontSize(10);d.setTextColor(17,17,17);d.text(w.t||'',x,wy+ch+6,{maxWidth:cw});
d.setFont('helvetica','normal');d.setFontSize(8.5);d.setTextColor(90,90,90);
d.splitTextToSize(w.d||'',cw).slice(0,2).forEach((l,j)=>d.text(l,x,wy+ch+10.5+j*4));
if(++col===3){col=0;wy+=ch+20}}}
d.save(((p.name||'CV').replace(/[^\w\- ]+/g,'').trim()||'CV')+' - CV.pdf');
}catch(e){if(!e||e.code!=='declined')alert('PDF export failed: '+(e&&e.message||e))}
btn.textContent=old}
